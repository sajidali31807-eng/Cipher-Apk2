name: Build Cipher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Repository
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type f

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Verify Gradle Wrapper
        run: |
          ls -l gradlew
          ls -l gradle/wrapper || true

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "ERROR: gradle-wrapper.jar is missing!"
            exit 1
          fi

          file gradle/wrapper/gradle-wrapper.jar

      - name: Create gradle.properties
        run: |
          cat > gradle.properties <<EOF
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

      - name: Download Sherpa-ONNX
        run: |
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.10.30/sherpa-onnx-v1.10.30-android.tar.bz2
          tar -xjf sherpa-onnx-v1.10.30-android.tar.bz2

      - name: Install Sherpa-ONNX to Local Maven
        run: |
          mkdir -p ~/.m2/repository/com/k2fsa/sherpa/onnx/sherpa-onnx/1.10.30

          AAR=$(find . -name "*.aar" | head -1)

          if [ -z "$AAR" ]; then
            echo "No AAR found."
            exit 1
          fi

          cp "$AAR" ~/.m2/repository/com/k2fsa/sherpa/onnx/sherpa-onnx/1.10.30/sherpa-onnx-1.10.30.aar

          cat > ~/.m2/repository/com/k2fsa/sherpa/onnx/sherpa-onnx/1.10.30/sherpa-onnx-1.10.30.pom <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project>
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.k2fsa.sherpa.onnx</groupId>
            <artifactId>sherpa-onnx</artifactId>
            <version>1.10.30</version>
            <packaging>aar</packaging>
          </project>
          EOF

      - name: Add mavenLocal Repository
        run: |
          if grep -q "mavenLocal()" settings.gradle.kts; then
            echo "mavenLocal already exists."
          else
            sed -i '/repositories {/a\        mavenLocal()' settings.gradle.kts
          fi

      - name: Test Gradle Wrapper
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Build Debug APK
        run: |
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cipher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
